services:
  - type: web
    name: enfercloud-dip
    runtime: python
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/registros/resumen
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./enfercloud.db
    disk:
      name: enfercloud-data
      mountPath: /opt/render/project/src
      sizeGB: 1
